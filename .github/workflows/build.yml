name: Test and build Windows exe

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the exe to this existing release tag (e.g. v1.3.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write  # only used to attach the exe to a GitHub release

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build window version
        run: pyinstaller --noconfirm --onefile --windowed --name WWE13-Resigner launcher.py
      - name: Build command-line version
        run: pyinstaller --noconfirm --onefile --console --name x360resign launcher.py
      - name: Build music converter (window and command-line)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name HddMusic-Converter music_launcher.py
          pyinstaller --noconfirm --onefile --console --name x360music music_launcher.py
      - name: Smoke test
        shell: pwsh
        run: |
          ./dist/x360resign.exe --version
          ./dist/x360resign.exe --help
          ./dist/x360music.exe --version
          ./dist/x360music.exe --help
      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/WWE13-Resigner.exe, dist/x360resign.exe, dist/HddMusic-Converter.exe, dist/x360music.exe, README.md -Destination package
          Copy-Item homebrew/HddMusic/README.md -Destination package/HddMusic-README.md
          Compress-Archive -Path package/* -DestinationPath WWE13-Resigner-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WWE13-Resigner-windows
          path: package/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" WWE13-Resigner-windows.zip dist/WWE13-Resigner.exe dist/x360resign.exe dist/HddMusic-Converter.exe dist/x360music.exe --clobber
          } else {
            gh release create "$env:TAG" WWE13-Resigner-windows.zip dist/WWE13-Resigner.exe dist/x360resign.exe dist/HddMusic-Converter.exe dist/x360music.exe --title "$env:TAG" --notes "Windows build of x360resign. Download WWE13-Resigner.exe and double-click it. See README.md for instructions."
          }
          exit $LASTEXITCODE
